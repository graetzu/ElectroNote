name: iOS TestFlight

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode* 2>/dev/null || true
          xcodebuild -version

      - name: Import distribution certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          echo "$CERTIFICATE_BASE64" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "" build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD" -A -T /usr/bin/codesign
          security list-keychains -s build.keychain login.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain

      - name: Setup App Store Connect API Key
        env:
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p ~/.private_keys
          echo "$ASC_PRIVATE_KEY_BASE64" | base64 --decode > ~/.private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Prepare App Store Connect & Provisioning
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          python3 -m venv /tmp/asc_venv
          /tmp/asc_venv/bin/pip install --upgrade pyjwt cryptography requests
          /tmp/asc_venv/bin/python3 scripts/prepare_appstore_connect.py

      - name: Build archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          if [ -n "$PROVISIONING_PROFILE_UUID" ]; then
            echo "Using manual signing with profile: $PROVISIONING_PROFILE_UUID"
            xcodebuild \
              -project ElectroNote.xcodeproj \
              -scheme ElectroNote \
              -configuration Release \
              -destination generic/platform=iOS \
              -archivePath /tmp/ElectroNote.xcarchive \
              DEVELOPMENT_TEAM=PFPJHZQH4E \
              CODE_SIGN_STYLE=Manual \
              CODE_SIGN_IDENTITY="Apple Distribution" \
              PROVISIONING_PROFILE_SPECIFIER="$PROVISIONING_PROFILE_UUID" \
              CURRENT_PROJECT_VERSION=${{ github.run_number }} \
              MARKETING_VERSION=1.0.0 \
              archive
          else
            echo "Using automatic signing with App Store Connect API updates"
            xcodebuild \
              -project ElectroNote.xcodeproj \
              -scheme ElectroNote \
              -configuration Release \
              -destination generic/platform=iOS \
              -archivePath /tmp/ElectroNote.xcarchive \
              -allowProvisioningUpdates \
              -authenticationKeyPath ~/.private_keys/AuthKey_${ASC_KEY_ID}.p8 \
              -authenticationKeyID "${ASC_KEY_ID}" \
              -authenticationKeyIssuerID "${ASC_ISSUER_ID}" \
              DEVELOPMENT_TEAM=PFPJHZQH4E \
              CURRENT_PROJECT_VERSION=${{ github.run_number }} \
              MARKETING_VERSION=1.0.0 \
              archive
          fi

      - name: Export IPA
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          if [ -n "$PROVISIONING_PROFILE_UUID" ]; then
            echo "Using manual export options with profile: $PROVISIONING_PROFILE_UUID"
            cat > /tmp/ExportOptions.plist << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>PFPJHZQH4E</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>de.graetz.electronote</key>
              <string>$PROVISIONING_PROFILE_UUID</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          PLIST
            xcodebuild -exportArchive \
              -archivePath /tmp/ElectroNote.xcarchive \
              -exportPath /tmp/ElectroNoteExport \
              -exportOptionsPlist /tmp/ExportOptions.plist
          else
            echo "Using automatic export options with API key"
            cat > /tmp/ExportOptions.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>PFPJHZQH4E</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>uploadSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          PLIST
            xcodebuild -exportArchive \
              -archivePath /tmp/ElectroNote.xcarchive \
              -exportPath /tmp/ElectroNoteExport \
              -exportOptionsPlist /tmp/ExportOptions.plist \
              -allowProvisioningUpdates \
              -authenticationKeyPath ~/.private_keys/AuthKey_${ASC_KEY_ID}.p8 \
              -authenticationKeyID "${ASC_KEY_ID}" \
              -authenticationKeyIssuerID "${ASC_ISSUER_ID}"
          fi

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          IPA_FILE=$(find /tmp/ElectroNoteExport -name "*.ipa" | head -n 1)
          echo "Found IPA: $IPA_FILE"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_FILE" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"
