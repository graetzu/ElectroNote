name: ElectroNote
options:
  bundleIdPrefix: de.graetz
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "2"

targets:
  ElectroNote:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ElectroNote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.graetz.electronote
        DEVELOPMENT_TEAM: ""
        TARGETED_DEVICE_FAMILY: "2"
        INFOPLIST_FILE: ElectroNote/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
